<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password - B2B Inventory Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 p-8 rounded-2xl shadow-2xl w-full max-w-md">
        <div class="flex items-center justify-center space-x-2 mb-6">
            <div class="bg-emerald-500 text-slate-950 p-2 rounded-lg text-xl font-bold">🌱</div>
            <h1 class="text-2xl font-bold text-white">B2B Inventory Tracker</h1>
        </div>
        <h2 class="text-lg text-slate-400 text-center mb-6">Reset Your Password</h2>

        {% if error %}
        <div class="bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs p-3 rounded-lg mb-4 text-center">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/reset-password" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Registered Email Address</label>
                <input type="email" name="email" value="{{ email or '' }}" required placeholder="you@example.com" 
                       class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">New Password</label>
                <input type="password" name="new_password" required placeholder="••••••••" 
                       class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Confirm New Password</label>
                <input type="password" name="confirm_password" required placeholder="••••••••" 
                       class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 rounded-lg text-sm transition">
                Reset Password
            </button>
        </form>

        <p class="text-xs text-slate-400 text-center mt-6">
            Remembered your password? <a href="/login" class="text-emerald-400 hover:underline">Back to sign in</a>
        </p>
    </div>
</body>
</html>
